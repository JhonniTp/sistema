<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturas</title>
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- sweetalert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="container mt-2">
    <div class="card">
        <div class="card-header">
            <h1 class="text-center">Facturas</h1>
        </div>
        <div class="card-body">
            <!-- botones -->
            <div class="d-flex justify-content-between mb-3">
                <div>
                    <button class="btn btn-primary btn-sm" onclick="buscarFacturas()">BUSCAR</button>
                    <button class="btn btn-success btn-sm" onclick="nuevo()">NUEVO</button>
                </div>
            </div>
            <!-- TABLA -->
            <div class="table-responsive">
                <table id="facturasTable" class="table table-bordered table-hover table-sm">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Monto</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="facturasBody">
                        <!-- Filas de la tabla se generarán dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    </div>
</body>

</html>
<script src="facturas.js"></script>
