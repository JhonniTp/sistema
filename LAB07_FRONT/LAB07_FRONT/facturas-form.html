<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Factura - Veterinaria</title>
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        xintegrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="container mt-2">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h1 class="text-center mb-0">Formulario de Factura Veterinaria</h1>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="nombre_propietario" class="form-label">Nombre del Propietario</label>
                    <input type="text" class="form-control" id="nombre_propietario" placeholder="Ej: Juan Pérez">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="nombre_mascota" class="form-label">Nombre de la Mascota</label>
                    <input type="text" class="form-control" id="nombre_mascota" placeholder="Ej: Rocky">
                </div>
            </div>
            <div class="mb-3">
                <label for="tratamiento" class="form-label">Tratamiento Aplicado</label>
                <textarea class="form-control" id="tratamiento" rows="3" placeholder="Ej: Vacunación anual y desparasitación"></textarea>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="monto" class="form-label">Monto (S/.)</label>
                    <input type="number" class="form-control" id="monto" placeholder="Ej: 150.00">
                </div>
                <div class="col-md-4 mb-3">
                    <label for="fecha_servicio" class="form-label">Fecha del Servicio</label>
                    <input type="date" class="form-control" id="fecha_servicio">
                </div>
                <div class="col-md-4 mb-3">
                    <label for="estado" class="form-label">Estado de la Factura</label>
                    <select class="form-select" id="estado">
                        <option value="PENDIENTE">PENDIENTE</option>
                        <option value="PAGADA">PAGADA</option>
                        <option value="PROCESADA">PROCESADA</option>
                    </select>
                </div>
            </div>
            <div class="d-flex justify-content-end">
                <button class="btn btn-secondary me-2" onclick="cancelar()">CANCELAR</button>
                <button class="btn btn-primary" onclick="guardarFactura()">GUARDAR FACTURA</button>
            </div>
        </div>
    </div>
</body>
</html>
<script src="facturas-form.js"></script>
