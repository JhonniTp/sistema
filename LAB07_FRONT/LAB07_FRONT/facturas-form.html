<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturas</title>
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>



<body class="container mt-2">
    <div class="card">
        <div class="card-header">
            <h1 class="text-center">Facturas Form</h1>
        </div>
        <div class="card-body">
            <div>
                <div class="mb-3">
                    <label for="cliente" class="form-label">Cliente</label>
                    <input type="text" class="form-control" id="cliente" >
                </div>
            </div>
            <div>
                <div class="mb-3">
                    <label for="monto" class="form-label">Monto</label>
                    <input type="number" class="form-control" id="monto" >
                </div>
            </div>
            <div>
                <div class="mb-3">
                    <label for="estado" class="form-label">Estado</label>
                    <select class="form-select" id="estado">
                        <option value="PENDIENTE">PENDIENTE</option>
                        <option value="PAGADA">PAGADA</option>
                        <option value="PROCESADA">PROCESADA</option>
                        <option value="INVALIDA">INVALIDA</option>
                    </select>
                </div>
            </div>
            <button class="btn btn-primary" onclick="guardarFactura()">GUARDAR</button>
            <button class="btn btn-secondary" onclick="cancelar()">CANCELAR</button>
        </div>
    </div>
</body>
</html>
<script src="facturas-form.js"></script>
